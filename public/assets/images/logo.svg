<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <polygon points="100,10 180,45 180,115 100,190 20,115 20,45" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Crown / Top emblem -->
  <path d="M70,55 L100,35 L130,55 L120,70 L80,70 Z" fill="url(#goldGrad)" />
  <circle cx="100" cy="35" r="4" fill="#fbbf24" />
  <circle cx="70" cy="55" r="3" fill="#fbbf24" />
  <circle cx="130" cy="55" r="3" fill="#fbbf24" />
  
  <!-- Science Atomic Orbits -->
  <ellipse cx="100" cy="110" rx="45" ry="16" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-30 100 110)" opacity="0.85"/>
  <ellipse cx="100" cy="110" rx="45" ry="16" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(30 100 110)" opacity="0.85"/>
  <circle cx="100" cy="110" r="10" fill="url(#goldGrad)"/>
  
  <!-- Text -->
  <text x="100" y="155" text-anchor="middle" fill="#ffffff" font-family="'Sarabun', sans-serif" font-weight="bold" font-size="14" letter-spacing="1">PCSHSKSN</text>
  <text x="100" y="172" text-anchor="middle" fill="#94a3b8" font-family="'Sarabun', sans-serif" font-size="9">จ.ภ.กส.</text>
</svg>